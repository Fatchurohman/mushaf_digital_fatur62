<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mushaf Digital - Mapping Tematik</title>
  <link rel="stylesheet" href="style.css?v=15.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Lateef&family=Noto+Naskh+Arabic:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Scheherazade+New:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Header Utama -->
  <header class="app-header">
    <div class="header-left">
      <div class="header-info">
        <h1 class="app-title">MUSHAF DIGITAL</h1>
        <span id="current-surah-title" class="app-subtitle">Al-Fatihah</span>
      </div>

      <!-- Badge Developer Lengkap & Counter Pengunjung -->
      <div class="header-meta-group" style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
        <div class="dev-badge-luxury">
          <div class="pulse-container">
            <span class="status-pulse"></span>
            <span class="status-ring"></span>
          </div>
          <span class="dev-label">DEVELOPER</span>
          <span class="dev-name">fatur62</span>
        </div>

        <div class="visitor-badge" style="background: rgba(22, 27, 34, 0.8); border: 1px solid var(--border-color); padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; color: var(--gold-light); display: flex; align-items: center; gap: 5px;">
          <span>👁️</span>
          <span id="visitor-count">...</span> Pengunjung
        </div>
      </div>
    </div>

    <!-- AREA ACTIONS (BARIS ATAS, TENGAH & BAWAH) -->
    <div class="header-actions" style="display: flex; flex-direction: column; align-items: stretch; gap: 6px;">
      
      <!-- Baris 1: Select Qori (4 Qori Terbaik) + Pilih Surah/Juz -->
      <div class="actions-top-row" style="display: flex; align-items: center; gap: 6px;">
        <select id="select-qori" class="select-qori-dropdown" title="Pilih Suara Qari" style="flex: 1;">
          <option value="05" selected>Mishary Rashid Al-Afasy</option>
          <option value="03">Abdurrahman As-Sudais</option>
          <option value="02">Abdul Muhsin Al-Qasim</option>
          <option value="04">Ibrahim Al-Dossari</option>
        </select>
        <button id="btn-pilih-surah" class="btn-pilih" style="white-space: nowrap;">Pilih Surah / Juz</button>
      </div>

      <!-- Baris 2: Pengaturan Font & Visibilitas Terjemahan -->
      <div class="actions-settings-row" style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
        <select id="select-arabic-font" class="select-qori-dropdown" title="Pilih Model Font Arab" style="flex: 1; min-width: 130px;">
          <option value="'Scheherazade New', serif" selected>Scheherazade</option>
          <option value="'Amiri', serif">Amiri</option>
          <option value="'Noto Naskh Arabic', serif">Noto Naskh</option>
          <option value="'Lateef', cursive">Lateef</option>
        </select>

        <div class="font-size-control" style="display: flex; align-items: center; gap: 4px; background: rgba(22, 27, 34, 0.8); border: 1px solid var(--border-color, #30363d); border-radius: 6px; padding: 2px 6px;">
          <button id="btn-font-decrease" type="button" title="Kecilkan Font" style="background: none; border: none; color: #fff; cursor: pointer; font-weight: bold; font-size: 0.9rem; padding: 2px 6px;">A-</button>
          <span id="font-size-display" style="font-size: 0.75rem; color: var(--gold-light, #f0e6d2); min-width: 24px; text-align: center;">28px</span>
          <button id="btn-font-increase" type="button" title="Besarkan Font" style="background: none; border: none; color: #fff; cursor: pointer; font-weight: bold; font-size: 0.9rem; padding: 2px 6px;">A+</button>
        </div>

        <button id="btn-toggle-translation" type="button" class="btn-pilih" title="Sembunyikan / Tampilkan Terjemahan" style="white-space: nowrap; font-size: 0.8rem; padding: 6px 10px;">
          🌐 <span id="label-toggle-translation">Sembunyikan Terjemahan</span>
        </button>
      </div>

      <!-- Baris 3: Lanjut Baca Terakhir & Catatan Digital berdampingan -->
      <div class="actions-bottom-row" style="display: flex; gap: 6px; width: 100%;">
        <button id="btn-last-read" class="btn-bookmark" title="Lanjut Baca Terakhir" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 12px; cursor: pointer;">
          <span>🔖</span>
          <span style="font-size: 0.8rem; font-weight: 600;">Lanjut Baca Terakhir</span>
        </button>
        <button id="btn-open-notes" class="btn-bookmark" title="Catatan Digital" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 12px; cursor: pointer; background: rgba(212, 163, 115, 0.25); border-color: var(--gold-light);">
          <span>📝</span>
          <span style="font-size: 0.8rem; font-weight: 600;">Catatan Digital</span>
        </button>
      </div>

    </div>
  </header>

  <!-- Area Konten Utama Surah -->
  <main id="quran-container" class="quran-container">
    <!-- Content & Audio Player dirender dinamis -->
  </main>

  <!-- Popup / Modal Daftar Surah & Mapping & Navigasi Juz -->
  <div id="modal-surah" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Peta Mapping & Navigasi Juz</h3>
        <button id="btn-close-modal" class="btn-close">&times;</button>
      </div>

      <!-- Tab Filter Quick-Mapping & Juz -->
      <div class="mapping-tabs">
        <button class="tab-btn active" data-filter="all">Semua Surah</button>
        <button class="tab-btn" data-filter="juz">Pilihan Juz (1-30)</button>
        <button class="tab-btn" data-filter="makkiyah">Makkiyah</button>
        <button class="tab-btn" data-filter="madaniyah">Madaniyah</button>
        <button class="tab-btn" data-filter="juz30">Juz 'Amma</button>
      </div>

      <!-- Input Pencarian Surah / Juz -->
      <div class="search-box-container" id="search-container">
        <input type="text" id="input-search-surah" class="search-input" placeholder="Cari nama, nomor surah, atau juz..." autocomplete="off">
      </div>

      <div id="surah-list-container" class="modal-body">
        <!-- List Surah atau List Juz dirender dinamis -->
      </div>
    </div>
  </div>

  <!-- MODAL Pop-up Deskripsi Mapping Tematik Lengkap -->
  <div id="modal-deskripsi-mapping" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-mapping-title">Peta Kandungan (Mapping Tematik)</h3>
        <button id="btn-close-modal-mapping" class="btn-close">&times;</button>
      </div>
      <div class="modal-body" style="padding: 16px; line-height: 1.6; color: #e0e0e0; font-size: 0.95rem;">
        <p id="modal-mapping-content" style="margin: 0; white-space: pre-line; word-break: break-word;">
          <!-- Teks deskripsi lengkap diisi melalui JS -->
        </p>
      </div>
    </div>
  </div>

  <!-- MODAL CATATAN DIGITAL (FULLSCREEN NOTEBOOK CANVAS) -->
  <div id="modal-notes" class="modal-overlay hidden">
    <div class="modal-card notes-modal-card">
      <div class="modal-header notes-header">
        <div class="notes-header-title">
          <h3>📝 Catatan Digital Mushaf</h3>
          <span class="notes-sub">Ketik & Tulis Tangan Responsif</span>
        </div>
        <button id="btn-close-notes" class="btn-close">&times;</button>
      </div>

      <!-- Toolbar Alat Catatan -->
      <div class="notes-toolbar">
        <div class="toolbar-group">
          <button id="tool-type" class="tool-btn active" title="Mode Ketik Teks">🔤 Ketik</button>
          <button id="tool-pen" class="tool-btn" title="Tulis Tangan (Pensil)">✏️ Tulis</button>
          <button id="tool-eraser" class="tool-btn" title="Penghapus Coretan">🧹 Hapus</button>
        </div>

        <div class="toolbar-group">
          <input type="color" id="note-color" value="#000000" title="Pilih Warna Tinta" class="color-picker-input">
          <button id="tool-clear" class="tool-btn danger" title="Bersihkan Halaman">🗑️ Bersihkan</button>
        </div>

        <div class="toolbar-group print-actions">
          <button id="tool-print" class="tool-btn primary" title="Cetak atau Simpan PDF">🖨️ Cetak / PDF</button>
        </div>
      </div>

      <!-- Area Lembaran Kertas Bergaris -->
      <div class="notes-paper-wrapper" id="print-area">
        <div class="notes-paper">
          <textarea id="notes-textarea" placeholder="Tuliskan catatan kajian atau tadabbur di sini..." autocomplete="off"></textarea>
          <canvas id="notes-canvas"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script src="./app.js?v=15.0"></script>
</body>
</html>
