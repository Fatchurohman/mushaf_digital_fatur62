<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mushaf Digital Fatur62</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#d4af37">
</head>
<body>

    <header class="app-header">
        <div class="header-title">
            <h1>Mushaf Digital</h1>
            <span id="current-surah-name">Al-Fatihah</span>
        </div>
        <button id="btn-open-mapping" class="gold-btn">📖 Pilih Surah</button>
    </header>

    <main class="container">
        <div id="surah-container" class="mushaf-frame">
            <!-- Tempat Ayat Al-Qur'an Ditampilkan -->
            <div class="loading">Memuat surah...</div>
        </div>
    </main>

    <!-- Modal Mapping / Daftar Surah -->
    <div id="mapping-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Daftar Surah</h2>
                <button id="btn-close-mapping" class="close-btn">&times;</button>
            </div>
            <div id="surah-list" class="surah-list">
                <!-- List Surah akan dimuat otomatis lewat JS -->
            </div>
        </div>
    </div>

    <script src="./app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('Service Worker Registered'))
                .catch(err => console.error('Service Worker Error:', err));
        }
    </script>
</body>
</html>
