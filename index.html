<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mushaf Digital</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <h1>MUSHAF DIGITAL</h1>
    <button id="btn-pilih-surah">Pilih Surah</button>
  </header>

  <!-- Container Utama Isi Ayat -->
  <main id="quran-container">
    <!-- Isi ayat akan dirender oleh JavaScript di sini -->
  </main>

  <!-- Modal / Popup Daftar Surah -->
  <div id="modal-surah" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Daftar Surah</h2>
        <span id="btn-close-modal" class="close-btn">&times;</span>
      </div>
      <div id="surah-list-container" class="modal-body">
        <!-- List 114 surah dari JSON akan dirender di sini -->
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
