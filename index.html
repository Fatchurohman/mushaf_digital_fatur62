<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Qur'an Klasik Mewah - fatur62</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@500;700;900&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="quran-container">
    <div class="inner-border">
        <!-- Header Surah -->
        <div class="header">
            <div class="surah-title-ar" id="headerTitleAr">سُورَةُ يٰسٓ</div>
            <div class="surah-subtitle" id="headerSubTitle">Surah Yasin (36) • Makkiyah • 83 Ayat</div>
        </div>

        <!-- Panel Kontrol Navigasi & Toggle -->
        <div class="controls">
            <div class="selector-wrapper">
                <label for="surahSelector" class="control-label">Pilih Surat:</label>
                <select id="surahSelector" class="surah-select"></select>
            </div>
            <div class="toggle-container">
                <span class="toggle-label">Terjemahan</span>
                <label class="switch">
                    <input type="checkbox" id="toggleTranslation" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <!-- Container Tempat Ayat Ditinggalkan -->
        <div class="content-area" id="surahContainer">
            <p style="text-align: center; color: var(--gold-dark);">Memuat data surat...</p>
        </div>

        <!-- Footer Teks 3D Logam Emas -->
        <div class="footer">
            <div class="metallic-gold-text">developer : fatur62</div>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
